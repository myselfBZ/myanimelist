[package]
name = "quick-start"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aide = { version = "0.15.1", features = [
    "axum",
    "axum-json",
    "macros",
    "swagger",
] }
anyhow = { version = "1.0.104" }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = "0.4.45"
dotenvy = { version = "0.15.7" }
schemars = { version = "0.9.0", features = ["indexmap2", "chrono04"] }
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "schema-sync",
    "entity-registry",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "runtime-tokio",
    "sqlx-postgres",
] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
substruct = "0.1.3"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utility-types = "0.0.4"

uuid = { version = "1.28.0", features = [
    "v4"
]}
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
futures-core = { version = "0.3.34" }
tokio-util = "0.7.20"
rust-s3 = "0.38.0"
bytes = "1.12.1"
